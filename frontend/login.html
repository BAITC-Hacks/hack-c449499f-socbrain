<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · SOCBrain</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body class="login-shell">

<form action="index.html" method="get">
  <h1>SOCBrain</h1>
  <p class="sub">Автопротоколирование совещаний</p>

  <label for="u">Логин</label>
  <input id="u" name="username" autocomplete="username" autofocus>

  <label for="p">Пароль</label>
  <input id="p" name="password" type="password" autocomplete="current-password">

  <button type="submit">Войти</button>

  <p class="sub" style="margin-top:16px;font-size:12px;">
    Каркас: проверки пароля и сессий пока нет — кнопка просто ведёт в кабинет.
  </p>
</form>

</body>
</html>
