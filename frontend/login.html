<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · Jinalys AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-shell">

<form action="index.html" method="get">
  <h1>Jinalys AI</h1>
  <p class="sub">Автопротоколирование совещаний</p>

  <label for="u">Логин</label>
  <input id="u" name="username" autocomplete="username" autofocus>

  <label for="p">Пароль</label>
  <input id="p" name="password" type="password" autocomplete="current-password">

  <button type="submit">Войти</button>

  <p class="sub" style="margin-top:16px;font-size:12px;">
    Проверка отключена — кнопка просто ведёт в кабинет. Настоящий вход
    (backend/app/auth.py) есть и работает отдельно, подключим обратно
    когда разберёмся с сетевой ошибкой.
  </p>
</form>

</body>
</html>
