<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Совещания · SOCBrain</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body data-page="meetings">

<nav class="side">
  <div class="brand">SOCBrain<small>автопротоколирование совещаний</small></div>

  <a href="index.html">Дашборд</a>
  <a href="meetings.html" class="on">Совещания</a>
  <a href="tasks.html">Поручения</a>

  <div class="bottom">
    <a href="settings.html">Настройки</a>
    <div class="who">
      <span>Артём Е.</span>
      <form method="get" action="login.html" class="inline"><button class="ghost">Выйти</button></form>
    </div>
  </div>
</nav>

<main>
  <h1>Совещания</h1>
  <p class="sub" id="found">Загрузка…</p>

  <h2>Новое совещание</h2>
  <form id="upload" class="filters">
    <div style="flex:2 1 260px"><label>тема</label><input type="text" name="title" required placeholder="Оперативное совещание" style="width:100%"></div>
    <div><label>дата</label><input type="date" name="meeting_date"></div>
    <div style="flex:2 1 260px"><label>запись (аудио/видео)</label><input type="file" name="file" required accept="audio/*,video/*"></div>
    <div style="flex:1 1 100%"><label>участники — по строке «Имя Отчество — должность» (необязательно, улучшает распознавание имён)</label>
      <textarea name="participants" rows="3" placeholder="Асхат Ерланович — заместитель председателя правления&#10;Гульмира Сериковна — директор департамента промышленной политики"></textarea></div>
    <div style="flex:1 1 100%"><label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text)">
      <input type="checkbox" name="consent" value="true" required>
      Участники уведомлены, что ведётся запись и транскрибация с помощью ИИ</label></div>
    <div><button type="submit">Загрузить и обработать</button> <span id="upload-msg" class="muted"></span></div>
  </form>

  <h2>Все совещания</h2>
  <form method="get" class="filters" id="filters">
    <div><label>с</label><input type="date" name="from"></div>
    <div><label>по</label><input type="date" name="to"></div>
    <div><label>участник</label><input type="text" name="who" placeholder="имя"></div>
    <div><label>язык</label>
      <select name="lang">
        <option value="">любой</option>
        <option value="ru">русский</option>
        <option value="kk">казахский</option>
        <option value="mixed">смешанный</option>
      </select>
    </div>
    <div><label>статус</label>
      <select name="status">
        <option value="">любой</option>
        <option value="done">готово</option>
        <option value="processing">обрабатывается</option>
        <option value="error">сбой</option>
      </select>
    </div>
    <div><label>в тексте протокола</label><input type="text" name="q" placeholder="слово"></div>
    <div><button type="submit">Найти</button></div>
  </form>

  <div id="list"></div>
</main>

<footer>SOCBrain · автопротоколирование совещаний · распознавание и диаризация — локально</footer>
<script src="js/api.js"></script>
</body>
</html>
