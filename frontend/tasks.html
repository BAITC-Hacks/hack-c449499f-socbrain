<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поручения · SOCBrain</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body data-page="tasks">

<nav class="side">
  <div class="brand">SOCBrain<small>автопротоколирование совещаний</small></div>

  <a href="index.html">Дашборд</a>
  <a href="meetings.html">Совещания</a>
  <a href="tasks.html" class="on">Поручения</a>

  <div class="bottom">
    <a href="settings.html">Настройки</a>
    <div class="who">
      <span>Артём Е.</span>
      <form method="get" action="login.html" class="inline"><button class="ghost">Выйти</button></form>
    </div>
  </div>
</nav>

<main>
  <h1>Поручения</h1>
  <p class="sub">Сквозной список по всем совещаниям. Из "Дополнительно" в ТЗ — статусы в работе / просрочено / выполнено.</p>

  <div class="cards" style="margin-bottom:20px" id="cards"></div>

  <form method="get" class="filters" id="filters">
    <div><label>ответственный</label><input type="text" name="who" placeholder="имя"></div>
    <div><label>статус</label>
      <select name="status">
        <option value="">любой</option>
        <option value="in_progress">в работе</option>
        <option value="overdue">просрочено</option>
        <option value="done">выполнено</option>
      </select>
    </div>
    <div><label>совещание</label><input type="text" name="meeting" placeholder="тема"></div>
    <div><button type="submit">Найти</button></div>
  </form>

  <div id="list"></div>
</main>

<footer>SOCBrain · автопротоколирование совещаний · распознавание и диаризация — локально</footer>
<script src="js/api.js"></script>
</body>
</html>
