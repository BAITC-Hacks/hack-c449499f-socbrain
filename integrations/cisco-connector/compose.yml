name: cisco-cms-connector
services:
  connector:
    build:
      context: .
      target: api
    image: local/cisco-cms-connector:0.4.0
    env_file: .env
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - connector-data:/data
      - ./certs:/certs:ro
    read_only: true
    tmpfs: /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}

  assistant:
    profiles: [assistant]
    build:
      context: .
      target: assistant
    image: local/cisco-cms-assistant:0.4.0
    env_file: .env
    # For production SIP/RTP use a Linux host with direct reachability from CMS/SBC.
    network_mode: host
    volumes:
      - connector-data:/data
      - ./certs:/certs:ro
    read_only: true
    tmpfs: /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}
volumes:
  connector-data:
